name: Daily Quant Engine

on:
  push:
    branches: [ master, main ]
  schedule:
    # 【裝甲3】亞洲盤後：UTC 08:35 = 澳門/台北/香港 16:35，
    # 台港股均已收盤 35 分鐘以上，足夠緩衝 GitHub Actions 排隊延遲。
    - cron: '35 8 * * 1-5'
    # 【裝甲3】美股盤後（雙保險，同時覆蓋冬令 EST 與夏令 EDT）：
    #   - 冬令時：美股收盤 UTC 21:00，UTC 21:35 = 收盤後 35 分鐘
    #   - 夏令時：美股收盤 UTC 20:00，UTC 21:35 = 收盤後 1.5 小時
    #   確保無論冬令或夏令、無論 GitHub 延遲多久，抓到的 100% 都是美股正式收盤後的完整日 K 線。
    - cron: '35 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-quant-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run quant engine, order bridges and notifier
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python quant_engine.py
          python ibkr_bridge.py --dry-run
          python binance_spot_bridge.py --dry-run
          python notifier.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history/*.csv data/signal_ledger.csv data/latest_signals.json data/ibkr_order_plan.json data/binance_spot_plan.json public/data/latest_signals.json public/data/ibkr_order_plan.json public/data/binance_spot_plan.json index.html public/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-update quant signals and history data"
            git push origin HEAD:master
          fi
