<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多資產量化戰情室</title>
<style>
  :root {
    --ivory: #FAF6EE;
    --ivory-card: #FFFDF8;
    --gold: #C9A227;
    --gold-soft: #E7D6A8;
    --dark: #3B3B3B;
    --muted: #7A7A7A;
    --green: #2E7D32;
    --blue: #1E5AA8;
    --yellow: #B08A00;
    --red: #B23A3A;
    --gray: #8A8A8A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--ivory);
    color: var(--dark);
    font-family: "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
    padding: 24px;
    line-height: 1.5;
    max-width: 1120px;
    margin: 0 auto;
  }
  header { text-align: center; margin-bottom: 26px; }
  header h1 {
    font-family: Georgia, "Times New Roman", "Noto Serif TC", serif;
    font-size: clamp(1.4rem, 3vw, 2rem);
    letter-spacing: 2px;
    display: inline-block;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--gold);
  }
  header .subtitle { color: var(--muted); margin-top: 10px; font-size: 0.9rem; }

  .summary { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 26px; }
  .summary .chip {
    background: var(--ivory-card);
    border: 1px solid var(--gold);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 0.85rem;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }

  .macro-card {
    background: var(--ivory-card);
    border: 1px solid var(--gold);
    border-radius: 12px;
    margin-bottom: 26px;
    padding: 16px 18px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
  }
  .macro-card h2 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.05rem;
    letter-spacing: 1px;
    margin-bottom: 14px;
    text-align: center;
  }
  .macro-grid { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .macro-item {
    flex: 1 1 180px;
    min-width: 150px;
    background: linear-gradient(180deg, #FFFDF8, #F5EEDC);
    border: 1px solid var(--gold-soft);
    border-radius: 10px;
    padding: 12px 14px;
    text-align: center;
  }
  .macro-item .macro-label { font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; }
  .macro-item .macro-value { font-family: Georgia, "Times New Roman", serif; font-size: 1.15rem; font-weight: 600; }
  /* 一級主分頁 */
  .main-tabs { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 16px; }
  .main-tab {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 10px 18px; border: 1px solid var(--gold); border-radius: 999px;
    background: var(--ivory-card); color: var(--dark);
    font-size: 0.95rem; font-family: inherit; cursor: pointer;
    transition: all 0.15s ease;
  }
  .main-tab .cnt { font-size: 0.74rem; color: var(--muted); background: #F0EADB; border-radius: 999px; padding: 1px 8px; }
  .main-tab:hover { background: #F8F2E2; }
  .main-tab.active {
    background: linear-gradient(180deg, #FBF3D5, #E7D6A8);
    border-color: var(--gold); color: #8a6d1a; font-weight: 700;
    box-shadow: 0 2px 8px rgba(201,162,39,0.25);
  }
  .main-tab.active .cnt { color: #8a6d1a; background: #F4E9C8; }

  /* 二級標的子分頁膠囊 */
  .sub-tabs {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-bottom: 22px; padding: 12px 14px;
    background: var(--ivory-card); border: 1px solid var(--gold-soft); border-radius: 14px;
  }
  .sub-tab {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 14px; border: 1px solid var(--gold-soft); border-radius: 999px;
    background: #FFF; color: var(--dark); font-size: 0.85rem;
    font-family: inherit; cursor: pointer; transition: all 0.15s ease;
  }
  .sub-tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gray); }
  .sub-tab .dot.green { background: var(--green); }
  .sub-tab .dot.blue { background: var(--blue); }
  .sub-tab .dot.yellow { background: var(--yellow); }
  .sub-tab .dot.red { background: var(--red); }
  .sub-tab .dot.fire { background: #B45309; }
  .sub-tab:hover { border-color: var(--gold); }
  .sub-tab.active { background: var(--dark); color: #FFF; border-color: var(--dark); }

  /* 高留白卡片 */
  .symbol-card {
    background: var(--ivory-card);
    border: 1px solid var(--gold);
    border-radius: 16px;
    padding: 28px 30px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.07);
  }
  .symbol-head {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 20px; padding-bottom: 16px;
    border-bottom: 1px solid var(--gold-soft);
  }
  .symbol-name { font-family: Georgia, "Times New Roman", serif; font-size: 1.4rem; letter-spacing: 1px; }
  .symbol-sym { color: var(--muted); font-size: 0.85rem; margin-left: 8px; }
  .symbol-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

  .tag { font-size: 0.78rem; padding: 3px 12px; border-radius: 999px; white-space: nowrap; border: 1px solid; }
  .tag.green  { color: var(--green);  border-color: var(--green);  background: #EAF4EA; }
  .tag.blue   { color: var(--blue);   border-color: var(--blue);   background: #E8F0FA; }
  .tag.yellow { color: var(--yellow); border-color: var(--yellow); background: #FAF3DE; }
  .tag.red    { color: var(--red);    border-color: var(--red);    background: #FAE9E9; }
  .tag.gray   { color: var(--gray);   border-color: var(--gray);   background: #F0F0F0; }
  .tag.fire   { color: #B45309;       border-color: #B45309;       background: #FEF3E2; }

  .model-badge {
    display: inline-block; font-size: 0.76rem; font-weight: 600;
    padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--gold-soft); background: #F8F2E2; color: #8a6d1a;
  }
  .score-badge { display: inline-block; font-size: 0.82rem; font-weight: 700; padding: 3px 12px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
  .score-badge.green  { color: var(--green);  border-color: var(--green);  background: #EAF4EA; }
  .score-badge.blue   { color: var(--blue);   border-color: var(--blue);   background: #E8F0FA; }
  .score-badge.yellow { color: var(--yellow); border-color: var(--yellow); background: #FAF3DE; }
  .score-badge.red    { color: var(--red);    border-color: var(--red);    background: #FAE9E9; }
  .score-badge.gray   { color: var(--gray);   border-color: var(--gray);   background: #F0F0F0; }
  .core-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 18px 26px; margin-bottom: 20px; }
  .metric .m-label { font-size: 0.76rem; color: var(--muted); margin-bottom: 5px; letter-spacing: 0.5px; }
  .metric .m-value { font-size: 1.05rem; font-weight: 600; }
  .up   { color: var(--green); }
  .down { color: var(--red); }
  .flat { color: var(--muted); }

  .reason-note {
    font-size: 0.85rem; color: var(--muted);
    margin-bottom: 22px; padding: 10px 14px;
    border-left: 3px solid var(--gold); background: #FAF6EE; border-radius: 6px;
  }

  .deepdive h3 { font-family: Georgia, "Times New Roman", serif; font-size: 1.05rem; letter-spacing: 1px; margin-bottom: 16px; color: #8a6d1a; }
  .d-section {
    margin-bottom: 18px; padding: 16px 18px;
    border: 1px dashed var(--gold-soft); border-radius: 12px;
    background: linear-gradient(180deg, #FFFDF8, #FAF5E8);
  }
  .d-section h4 { font-size: 0.9rem; font-weight: 700; color: var(--dark); margin-bottom: 12px; letter-spacing: 0.5px; }
  .d-items { display: flex; flex-wrap: wrap; gap: 12px 28px; }
  .d-item { display: flex; flex-direction: column; gap: 3px; min-width: 140px; }
  .d-item .d-label { font-size: 0.75rem; color: var(--muted); }
  .d-item .d-value { font-size: 0.95rem; font-weight: 600; }
  .empty { color: var(--muted); font-size: 0.85rem; }

  .ledger { margin-top: 26px; }
  .ledger summary {
    cursor: pointer; font-family: Georgia, "Times New Roman", serif;
    font-size: 1rem; letter-spacing: 1px; color: var(--dark); padding: 8px 0;
  }
  .ledger .ledger-body {
    background: var(--ivory-card); border: 1px solid var(--gold);
    border-radius: 12px; padding: 16px 18px; margin-top: 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06); overflow-x: auto;
  }
  .ledger table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  .ledger th, .ledger td { padding: 7px 9px; border-bottom: 1px dashed var(--gold-soft); text-align: left; }
  .ledger th { color: var(--muted); font-weight: 600; white-space: nowrap; }

  footer { text-align: center; margin-top: 28px; color: var(--muted); font-size: 0.8rem; }
</style>
</head>
<body>
  <header>
    <h1>📊 多資產量化戰情室</h1>
    <div class="subtitle" id="subtitle">載入中…</div>
  </header>
  <section class="macro-card" id="macro" style="display:none;">
    <h2>🌍 全球宏觀與市場情緒溫度計</h2>
    <div class="macro-grid" id="macroGrid"></div>
  </section>
  <div class="summary" id="summary"></div>

  <nav class="main-tabs" id="mainTabs"></nav>
  <nav class="sub-tabs" id="subTabs"></nav>
  <div id="content"></div>

  <details class="ledger" id="ledgerWrap" style="display:none;">
    <summary>📒 歷史訊號與 30/90/180 天驗證帳本</summary>
    <div class="ledger-body" id="ledgerBody"></div>
  </details>

  <footer>Quant Multi-Asset Engine · 資料來源 Yahoo Finance</footer>

  <script>
    const CATEGORY_ORDER = ["Crypto", "Stocks", "REITs", "Bonds", "ETFs", "Gold"];
    const CATEGORY_ICON = { Crypto: "🪙", Stocks: "📈", REITs: "🏢", Bonds: "📜", ETFs: "🧺", Gold: "🥇" };
    const MODEL_LABEL = {
      crypto_momentum_nomad: "幣圈動能 × 遊牧民",
      stock_fundamental_tech: "基本面 × 技術",
      reit_yield_nav: "殖利率利差 × 淨值",
      bond_macro_duration: "債券宏觀 × 存續期間",
      cash_parking_pool: "現金停泊資金池",
      etf_index_allocation: "指數配置",
      gold_macro_turtle: "黃金宏觀 × 海龜",
      generic: "通用模型"
    };

    let state = { data: null, cat: null, sym: null };
    function tagClass(signal) {
      if (!signal) return "gray";
      if (signal.startsWith("🟢")) return "green";
      if (signal.startsWith("🔵")) return "blue";
      if (signal.startsWith("🟡")) return "yellow";
      if (signal.startsWith("🔴")) return "red";
      if (signal.startsWith("🔥")) return "fire";
      return "gray";
    }
    function changeClass(v) {
      if (v === null || v === undefined) return "flat";
      return v >= 0 ? "up" : "down";
    }
    function scoreClass(s) {
      if (s === null || s === undefined) return "gray";
      if (s >= 80) return "green";
      if (s >= 60) return "blue";
      if (s >= 40) return "yellow";
      return "red";
    }
    function fmt(v, d) {
      if (v === null || v === undefined) return null;
      return Number(v).toFixed(d === undefined ? 2 : d);
    }
    function fmtSignedPct(v) {
      if (v === null || v === undefined) return null;
      const n = Number(v);
      return (n >= 0 ? "+" : "") + n.toFixed(2) + "%";
    }
    function fmtWeight(v) {
      if (v === null || v === undefined) return null;
      return Number(v).toFixed(2) + "%";
    }
    function fmtInt(v) {
      if (v === null || v === undefined) return null;
      return Number(v).toFixed(0);
    }
    function maTrend(ma20, ma60) {
      if (ma20 === null || ma60 === null || ma20 === undefined || ma60 === undefined) return null;
      if (ma20 > ma60) return "多頭排列 ↑";
      if (ma20 < ma60) return "空頭排列 ↓";
      return "均線糾結";
    }
    // 專屬指標格式化：無效值回傳 null，由呼叫端跳過，避免顯示 N/A
    function fmtDomain(v, kind) {
      if (v === null || v === undefined || v === "") return null;
      switch (kind) {
        case "price":
        case "num":
          return Number(v).toFixed(2);
        case "pct":
          return Number(v).toFixed(2) + "%";
        case "yield":
          return (Number(v) * 100).toFixed(2) + "%";
        case "score":
          return Number(v).toFixed(1) + " / 10";
        case "score6":
          return Number(v).toFixed(0) + " / 6";
        case "bool":
          return v ? "✅" : "❌";
        case "signal":
        case "text":
        default:
          return String(v);
      }
    }
    function coreMetrics(it) {
      const list = [];
      const add = (label, html) => { if (html !== null && html !== "") list.push({ label, html }); };
      const p = fmt(it.price);
      const chg = fmtSignedPct(it.change_pct);
      add("現價", p === null ? null : p + (chg !== null ? ` <span class="${changeClass(it.change_pct)}">${chg}</span>` : ""));
      add("RSI (14)", fmt(it.rsi14));
      add("均線排列", maTrend(it.ma20, it.ma60));
      add("週期定位", it.horizon || null);
      add("建議買入", fmt(it.ideal_buy_price));
      add("嚴格止損", fmt(it.stop_loss_price));
      add("目標停利", fmt(it.take_profit_price));
      add("建議倉位", fmtWeight(it.suggested_weight_pct));
      return list.slice(0, 8);
    }

    function domainSectionsHtml(it) {
      const sections = it.domain_metrics || [];
      if (!sections.length) return '<div class="empty">尚無專屬深潛指標</div>';
      let html = "";
      for (const sec of sections) {
        const items = (sec.items || []).filter(x => x.value !== null && x.value !== undefined && x.value !== "");
        if (!items.length) continue;
        const itemsHtml = items.map(x => {
          const val = fmtDomain(x.value, x.kind);
          return `<div class="d-item"><span class="d-label">${x.label}</span><span class="d-value">${val}</span></div>`;
        }).join("");
        html += `<div class="d-section"><h4>${sec.title}</h4><div class="d-items">${itemsHtml}</div></div>`;
      }
      return html || '<div class="empty">尚無專屬深潛指標</div>';
    }

    function renderSymbol(it) {
      const content = document.getElementById("content");
      const cls = tagClass(it.signal);
      const model = MODEL_LABEL[it.asset_model_type] || it.asset_model_type || "通用模型";
      const core = coreMetrics(it).map(m =>
        `<div class="metric"><div class="m-label">${m.label}</div><div class="m-value">${m.html}</div></div>`
      ).join("");
      content.innerHTML = `
        <article class="symbol-card">
          <div class="symbol-head">
            <div>
              <span class="symbol-name">${it.name}</span>
              <span class="symbol-sym">${it.symbol}</span>
            </div>
            <div class="symbol-tags">
              <span class="tag ${cls}">${it.signal || "⚪ 區間觀望"}</span>
              <span class="model-badge">🔧 ${model}</span>
              <span class="score-badge ${scoreClass(it.master_score)}">🎯 五師評分 ${fmtInt(it.master_score)}</span>
            </div>
          </div>
          <div class="core-grid">${core}</div>
          <div class="reason-note">📝 ${it.action_reason || "無操作說明"}</div>
          <div class="deepdive">
            <h3>🔍 專屬深潛指標</h3>
            ${domainSectionsHtml(it)}
          </div>
        </article>`;
    }

    function selectSymbol(sym) {
      state.sym = sym;
      document.querySelectorAll("#subTabs .sub-tab").forEach(b =>
        b.classList.toggle("active", b.dataset.sym === sym));
      const items = state.data.assets[state.cat] || [];
      const it = items.find(x => x.symbol === sym);
      if (it) renderSymbol(it);
    }

    function selectCategory(cat) {
      state.cat = cat;
      state.sym = null;
      const items = state.data.assets[cat] || [];
      document.querySelectorAll("#mainTabs .main-tab").forEach(b =>
        b.classList.toggle("active", b.dataset.cat === cat));
      const sub = document.getElementById("subTabs");
      sub.innerHTML = items.map(it =>
        `<button class="sub-tab" data-sym="${it.symbol}"><span class="dot ${tagClass(it.signal)}"></span>${it.symbol}</button>`
      ).join("");
      sub.querySelectorAll(".sub-tab").forEach(btn =>
        btn.addEventListener("click", () => selectSymbol(btn.dataset.sym)));
      if (items.length) selectSymbol(items[0].symbol);
    }

    function renderMainTabs(data) {
      const cats = CATEGORY_ORDER.filter(c => (data.assets?.[c] || []).length > 0);
      for (const c of Object.keys(data.assets || {})) {
        if (!cats.includes(c)) cats.push(c);
      }
      const nav = document.getElementById("mainTabs");
      nav.innerHTML = cats.map(c => {
        const items = data.assets[c] || [];
        return `<button class="main-tab" data-cat="${c}">${CATEGORY_ICON[c] || "📦"} ${c}<span class="cnt">${items.length}</span></button>`;
      }).join("");
      nav.querySelectorAll(".main-tab").forEach(btn =>
        btn.addEventListener("click", () => selectCategory(btn.dataset.cat)));
      if (cats.length) selectCategory(cats[0]);
    }
    function renderMacro(macro) {
      const el = document.getElementById("macro");
      const grid = document.getElementById("macroGrid");
      if (!macro) { el.style.display = "none"; return; }
      el.style.display = "block";
      const num = (v, suffix = "") =>
        (v === null || v === undefined) ? "N/A" : Number(v).toFixed(2) + suffix;
      const fng = macro.crypto_fear_greed;
      const fngValue = (fng === null || fng === undefined)
        ? "N/A"
        : Number(fng).toFixed(0) + (macro.crypto_fear_greed_classification ? "（" + macro.crypto_fear_greed_classification + "）" : "");
      const items = [
        { label: "🇺🇸 10年期美債殖利率", value: num(macro.us10y_yield, "%") },
        { label: "💵 美元指數 DXY", value: num(macro.dxy) },
        { label: "😨 VIX 恐慌指數", value: num(macro.vix) + (macro.vix_zone ? "（" + macro.vix_zone + "）" : "") },
        { label: "🪙 幣圈恐慌貪婪", value: fngValue },
      ];
      grid.innerHTML = items.map(it =>
        `<div class="macro-item"><div class="macro-label">${it.label}</div><div class="macro-value">${it.value}</div></div>`
      ).join("");
    }

    function renderLedger(data) {
      const wrap = document.getElementById("ledgerWrap");
      const body = document.getElementById("ledgerBody");
      const ls = data.ledger_summary;
      if (!ls || (!ls.total_signals && !ls.evaluated)) { wrap.style.display = "none"; return; }
      wrap.style.display = "block";
      const ov = ls.overall || {};
      const pct = v => (v === null || v === undefined)
        ? "N/A" : (Number(v) >= 0 ? "+" : "") + Number(v).toFixed(2) + "%";
      const wp = v => (v === null || v === undefined) ? "N/A" : Number(v).toFixed(1) + "%";
      let html = `<div class="summary" style="margin-bottom:12px;">`;
      html += `<div class="chip">📒 歷史訊號 ${ls.total_signals ?? 0} 筆</div>`;
      html += `<div class="chip">✅ 已驗證 ${ls.evaluated ?? 0} 筆</div>`;
      html += `<div class="chip">平均 MFE ${pct(ov.avg_mfe_pct)}</div>`;
      html += `<div class="chip">平均 MAE ${pct(ov.avg_mae_pct)}</div>`;
      html += `<div class="chip">平均累積報酬 ${pct(ov.avg_current_return_pct)}</div>`;
      html += `<div class="chip">目前勝率 ${wp(ov.win_rate_pct)}</div>`;
      html += `</div>`;
      const by = ls.by_symbol || {};
      const syms = Object.keys(by);
      if (syms.length) {
        html += `<table><thead><tr><th>標的</th><th>訊號數</th><th>平均 MFE%</th><th>平均 MAE%</th><th>平均累積報酬</th><th>勝率</th></tr></thead><tbody>`;
        for (const s of syms) {
          const b = by[s];
          html += `<tr><td>${s}</td><td>${b.signals}</td><td>${pct(b.avg_mfe_pct)}</td><td>${pct(b.avg_mae_pct)}</td><td>${pct(b.avg_current_return_pct)}</td><td>${wp(b.win_rate_pct)}</td></tr>`;
        }
        html += `</tbody></table>`;
      }
      const rows = ls.rows || [];
      if (rows.length) {
        html += `<div style="margin-top:10px;font-size:0.8rem;color:var(--muted);">近期驗證明細（最多 200 筆）</div>`;
        html += `<table><thead><tr><th>日期</th><th>標的</th><th>MFE%</th><th>MAE%</th><th>累積報酬</th><th>30日</th><th>90日</th><th>180日</th></tr></thead><tbody>`;
        for (const r of rows) {
          html += `<tr><td>${r.date}</td><td>${r.symbol}</td><td>${pct(r.mfe_pct)}</td><td>${pct(r.mae_pct)}</td><td>${pct(r.current_return_pct)}</td><td>${pct(r.return_30d_pct)}</td><td>${pct(r.return_90d_pct)}</td><td>${pct(r.return_180d_pct)}</td></tr>`;
        }
        html += `</tbody></table>`;
      }
      body.innerHTML = html;
    }

    function render(data) {
      state.data = data;
      document.getElementById("subtitle").textContent = "產生時間：" + (data.generated_at || "N/A");
      const summary = document.getElementById("summary");
      const sc = data.summary?.signal_counts || {};
      let chips = `<div class="chip">總標的：${data.summary?.total_assets ?? 0} 檔</div>`;
      for (const [sig, cnt] of Object.entries(sc)) chips += `<div class="chip">${sig} × ${cnt}</div>`;
      summary.innerHTML = chips;
      renderMacro(data.macro_overview);
      renderLedger(data);
      renderMainTabs(data);
    }

    function loadJson(url) {
      return fetch(url, { cache: "no-store" }).then(r => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      });
    }

    // 部署於 Hostinger 子網域根目錄時，優先讀取 public 內的資料，失敗則 fallback
    loadJson("./public/data/latest_signals.json")
      .catch(() => loadJson("./data/latest_signals.json"))
      .then(render)
      .catch(err => {
        document.getElementById("subtitle").textContent = "⚠️ 無法載入資料：" + err.message;
        document.getElementById("summary").innerHTML =
          '<div class="chip">請先執行 python quant_engine.py 產生資料，並以 HTTP 伺服器開啟本頁（例如在 public 目錄執行 python -m http.server）。</div>';
      });
  </script>
</body>
</html>
