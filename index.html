<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>六大資產量化戰情室</title>
<style>
  :root {
    --ivory: #FAF6EE;        /* 象牙白 */
    --ivory-card: #FFFDF8;   /* 卡片底 */
    --gold: #C9A227;         /* 香檳金 */
    --gold-soft: #E7D6A8;    /* 淡金 */
    --dark: #3B3B3B;         /* 深灰字體 */
    --muted: #7A7A7A;
    --green: #2E7D32;
    --blue: #1E5AA8;
    --yellow: #B08A00;
    --red: #B23A3A;
    --gray: #8A8A8A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--ivory);
    color: var(--dark);
    font-family: "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
    padding: 24px;
    line-height: 1.5;
  }
  header { text-align: center; margin-bottom: 26px; }
  header h1 {
    font-family: Georgia, "Times New Roman", "Noto Serif TC", serif;
    font-size: clamp(1.4rem, 3vw, 2rem);
    letter-spacing: 2px;
    display: inline-block;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--gold);
  }
  header .subtitle { color: var(--muted); margin-top: 10px; font-size: 0.9rem; }

  .summary {
    display: flex; flex-wrap: wrap; gap: 10px;
    justify-content: center; margin-bottom: 28px;
  }
  .summary .chip {
    background: var(--ivory-card);
    border: 1px solid var(--gold);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 0.85rem;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }

  .macro-card {
    background: var(--ivory-card);
    border: 1px solid var(--gold);
    border-radius: 12px;
    margin-bottom: 26px;
    padding: 16px 18px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
  }
  .macro-card h2 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.05rem;
    letter-spacing: 1px;
    margin-bottom: 14px;
    text-align: center;
  }
  .macro-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }
  .macro-item {
    flex: 1 1 180px;
    min-width: 150px;
    background: linear-gradient(180deg, #FFFDF8, #F5EEDC);
    border: 1px solid var(--gold-soft);
    border-radius: 10px;
    padding: 12px 14px;
    text-align: center;
  }
  .macro-item .macro-label {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .macro-item .macro-value {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--dark);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 20px;
  }
  .card {
    background: var(--ivory-card);
    border: 1px solid var(--gold);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
  }
  .card h2 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.15rem;
    padding: 14px 18px;
    border-bottom: 1px solid var(--gold-soft);
    background: linear-gradient(180deg, #FFFDF8, #F5EEDC);
    letter-spacing: 1px;
  }
  .asset { padding: 12px 18px; border-bottom: 1px dashed var(--gold-soft); }
  .asset:last-child { border-bottom: none; }
  .asset .row1 {
    display: flex; justify-content: space-between;
    align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .asset .name { font-weight: 600; }
  .asset .sym { color: var(--muted); font-size: 0.82rem; margin-left: 5px; }
  .tag {
    font-size: 0.76rem; padding: 2px 10px;
    border-radius: 999px; white-space: nowrap; border: 1px solid;
  }
  .tag.green  { color: var(--green);  border-color: var(--green);  background: #EAF4EA; }
  .tag.blue   { color: var(--blue);   border-color: var(--blue);   background: #E8F0FA; }
  .tag.yellow { color: var(--yellow); border-color: var(--yellow); background: #FAF3DE; }
  .tag.red    { color: var(--red);    border-color: var(--red);    background: #FAE9E9; }
  .tag.gray   { color: var(--gray);   border-color: var(--gray);   background: #F0F0F0; }
  .tag.fire   { color: #B45309;   border-color: #B45309;   background: #FEF3E2; }
  .asset .metrics {
    margin-top: 6px; font-size: 0.84rem;
    display: flex; flex-wrap: wrap; gap: 4px 14px;
  }
  .asset .reason {
    margin-top: 6px; font-size: 0.8rem; color: var(--muted);
  }
  .up   { color: var(--green); }
  .down { color: var(--red); }
  .flat { color: var(--muted); }
  .score-badge {
    display: inline-block; font-size: 0.82rem; font-weight: 700;
    padding: 2px 10px; border-radius: 999px; border: 1px solid; white-space: nowrap;
  }
  .score-badge.green  { color: var(--green);  border-color: var(--green);  background: #EAF4EA; }
  .score-badge.blue   { color: var(--blue);   border-color: var(--blue);   background: #E8F0FA; }
  .score-badge.yellow { color: var(--yellow); border-color: var(--yellow); background: #FAF3DE; }
  .score-badge.red    { color: var(--red);    border-color: var(--red);    background: #FAE9E9; }
  .score-badge.gray   { color: var(--gray);   border-color: var(--gray);   background: #F0F0F0; }
  .asset .masters {
    margin-top: 8px; padding: 8px 10px;
    border: 1px dashed var(--gold-soft); border-radius: 8px;
    background: linear-gradient(180deg, #FFFDF8, #F8F2E2);
  }
  .asset .master-row {
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 4px;
  }
  .asset .stage { font-size: 0.8rem; color: var(--dark); }
  .master-table {
    background: var(--ivory-card); border: 1px solid var(--gold);
    border-radius: 12px; padding: 16px 18px; margin-bottom: 26px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06); overflow-x: auto;
  }
  .master-table h2 {
    font-family: Georgia, "Times New Roman", serif; font-size: 1.05rem;
    letter-spacing: 1px; margin-bottom: 12px; text-align: center;
  }
  .master-table table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  .master-table th, .master-table td {
    padding: 7px 9px; border-bottom: 1px dashed var(--gold-soft); text-align: left;
  }
  .master-table th { color: var(--muted); font-weight: 600; white-space: nowrap; }
  .master-table th.sortable { cursor: pointer; user-select: none; }
  .master-table th.sortable:hover { color: var(--gold); }
  .master-table .stage-cell { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
  .champagne {
    display: inline-block; font-size: 0.78rem; font-weight: 700;
    padding: 2px 8px; border-radius: 999px; border: 1px solid var(--gold);
    background: linear-gradient(180deg, #FBF3D5, #E7D6A8); color: #8a6d1a; white-space: nowrap;
  }
  .grade-aplus {
    display: inline-block; font-size: 0.76rem; font-weight: 700; color: #8a6d1a;
    background: linear-gradient(180deg, #FBF3D5, #E7D6A8); border: 1px solid var(--gold);
    border-radius: 999px; padding: 2px 8px; white-space: nowrap;
  }
  .valuation { margin-top: 6px; padding: 6px 10px; border: 1px dashed var(--gold-soft); border-radius: 8px; }
  .five-dim { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: 0.76rem; }
  .five-dim .dim { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .five-dim .dim .lbl { color: var(--muted); }
  .five-dim .bar { width: 44px; height: 6px; background: #EEE5CF; border-radius: 3px; overflow: hidden; }
  .five-dim .bar i { display: block; height: 100%; background: var(--gold); }
  footer { text-align: center; margin-top: 28px; color: var(--muted); font-size: 0.8rem; }
</style>
</head>
<body>
  <header>
    <h1>📊 六大資產量化戰情室</h1>
    <div class="subtitle" id="subtitle">載入中…</div>
  </header>
  <section class="macro-card" id="macro" style="display:none;">
    <h2>🌍 全球宏觀與市場情緒溫度計</h2>
    <div class="macro-grid" id="macroGrid"></div>
  </section>
  <div class="summary" id="summary"></div>
  <section class="master-table" id="masterTable"></section>
  <div class="grid" id="grid"></div>
  <footer>Quant Multi-Asset Engine · 資料來源 Yahoo Finance</footer>

  <script>
    const CATEGORY_ORDER = ["Crypto", "Stocks", "REITs", "Bonds", "ETFs", "Gold"];
    const CATEGORY_ICON = {
      Crypto: "🪙", Stocks: "📈", REITs: "🏢", Bonds: "📜", ETFs: "🧺", Gold: "🥇"
    };

    function tagClass(signal) {
      if (!signal) return "gray";
      if (signal.startsWith("🟢")) return "green";
      if (signal.startsWith("🔵")) return "blue";
      if (signal.startsWith("🟡")) return "yellow";
      if (signal.startsWith("🔴")) return "red";
      if (signal.startsWith("🔥")) return "fire";
      return "gray";
    }

    function fmt(v, d = 2) {
      if (v === null || v === undefined) return "N/A";
      return Number(v).toFixed(d);
    }
    function fmtPct(v) {
      if (v === null || v === undefined) return "N/A";
      const n = Number(v);
      return (n >= 0 ? "+" : "") + n.toFixed(2) + "%";
    }
    function fmtYield(v) {
      if (v === null || v === undefined) return "N/A";
      return (Number(v) * 100).toFixed(2) + "%";
    }
    function fmtRate(v) {
      if (v === null || v === undefined) return "N/A";
      return (Number(v) * 100).toFixed(1) + "%";
    }
    function fmtRateSigned(v) {
      if (v === null || v === undefined) return "N/A";
      const n = Number(v) * 100;
      return (n >= 0 ? "+" : "") + n.toFixed(2) + "%";
    }
    function fmtRatio(v) {
      if (v === null || v === undefined) return "N/A";
      return Number(v).toFixed(2);
    }
    function fmtWeight(v) {
      if (v === null || v === undefined) return "N/A";
      return Number(v).toFixed(2) + "%";
    }
    function maTrend(ma20, ma60) {
      if (ma20 === null || ma60 === null || ma20 === undefined || ma60 === undefined) return "N/A";
      if (ma20 > ma60) return "多頭排列 ↑";
      if (ma20 < ma60) return "空頭排列 ↓";
      return "均線糾結";
    }
    function changeClass(v) {
      if (v === null || v === undefined) return "flat";
      return v >= 0 ? "up" : "down";
    }
    function fmtInt(v) {
      if (v === null || v === undefined) return "N/A";
      return Number(v).toFixed(0);
    }
    function fmtVolRatio(v) {
      if (v === null || v === undefined) return "N/A";
      return Number(v).toFixed(2) + "x";
    }
    function scoreClass(s) {
      if (s === null || s === undefined) return "gray";
      if (s >= 80) return "green";
      if (s >= 60) return "blue";
      if (s >= 40) return "yellow";
      return "red";
    }
    function maVsPrice(price, ma) {
      if (price === null || price === undefined || ma === null || ma === undefined) return "";
      return price > ma ? "↑站上" : "↓跌破";
    }
    function cloudLabel(c) { return c || "N/A"; }
    function fmtRuleOf40(v) {
      if (v === null || v === undefined) return "N/A";
      return Number(v).toFixed(1) + "%";
    }
    function rule40Badge(it) {
      return it.rule_of_40_met ? ' <span class="champagne">🍾 達標</span>' : "";
    }
    function fiveDimClass(s) {
      if (s === null || s === undefined) return "gray";
      if (s >= 8) return "green";
      if (s >= 6) return "blue";
      if (s >= 4) return "yellow";
      return "red";
    }
    function fiveDimHtml(it) {
      const s = it.five_dim_scores;
      if (!s) return "";
      const dims = [
        ["成長", s.growth], ["獲利", s.profitability], ["低估", s.undervaluation],
        ["安全", s.safety], ["暴漲", s.explosive]
      ];
      const bars = dims.map(([lbl, v]) => {
        const n = (v === null || v === undefined) ? 0 : Number(v);
        return `<span class="dim"><span class="lbl">${lbl}</span><span class="bar"><i style="width:${Math.max(0, Math.min(100, n * 10))}%"></i></span><b>${n.toFixed(1)}</b></span>`;
      }).join("");
      const avg = (s.average === null || s.average === undefined) ? "N/A" : Number(s.average).toFixed(1);
      const grade = s.is_a_plus
        ? ` <span class="grade-aplus">${s.grade || "主力級 A+"}</span>`
        : (s.grade ? ` <span class="tag gray">${s.grade}</span>` : "");
      return `<div class="five-dim">${bars}<span class="dim"><span class="lbl">平均</span><b>${avg}</b>${grade}</span></div>`;
    }

    const MASTER_SORT_KEYS = {
      master_score: it => (it.master_score === null || it.master_score === undefined) ? -1 : Number(it.master_score),
      five_dim: it => (it.five_dim_scores?.average === null || it.five_dim_scores?.average === undefined) ? -1 : Number(it.five_dim_scores.average),
      upside_2: it => (it.upside_2 === null || it.upside_2 === undefined) ? -999 : Number(it.upside_2),
      rule_of_40: it => (it.rule_of_40 === null || it.rule_of_40 === undefined) ? -1 : Number(it.rule_of_40),
    };
    let masterSort = { key: "master_score", asc: false };

    function renderMasterTable(data, key, asc) {
      key = key || masterSort.key;
      asc = asc !== undefined ? asc : masterSort.asc;
      masterSort = { key: key, asc: asc };
      const all = [];
      for (const cat of CATEGORY_ORDER) {
        for (const it of (data.assets?.[cat] || [])) all.push(it);
      }
      const getter = MASTER_SORT_KEYS[key] || MASTER_SORT_KEYS.master_score;
      all.sort((a, b) => {
        const va = getter(a), vb = getter(b);
        return asc ? va - vb : vb - va;
      });
      const arrow = k => (masterSort.key === k ? (masterSort.asc ? "▲" : "▼") : "");
      const rows = all.map((it, i) => {
        const chgCls = changeClass(it.change_pct);
        const fds = it.five_dim_scores || {};
        const fdsAvg = (fds.average === null || fds.average === undefined) ? "N/A" : Number(fds.average).toFixed(1);
        const ups2 = (it.upside_2 === null || it.upside_2 === undefined) ? "N/A" : fmtRateSigned(it.upside_2);
        const dwn = (it.downside_risk === null || it.downside_risk === undefined) ? "N/A" : fmtRateSigned(it.downside_risk);
        const rule40 = (it.rule_of_40 === null || it.rule_of_40 === undefined)
          ? "N/A"
          : `<span class="${it.rule_of_40_met ? "champagne" : ""}">${Number(it.rule_of_40).toFixed(1)}%</span>`;
        return `<tr>
          <td>${i + 1}</td>
          <td>${it.name}<span class="sym">${it.symbol}</span></td>
          <td><span class="score-badge ${scoreClass(it.master_score)}">${fmtInt(it.master_score)}</span></td>
          <td><span class="score-badge ${fiveDimClass(fds.average)}">${fdsAvg}</span>${fds.is_a_plus ? ' <span class="grade-aplus">主力級 A+</span>' : ""}</td>
          <td>${fmt(it.target_price_2)} <span class="${changeClass(it.upside_2)}">${ups2}</span></td>
          <td>${fmt(it.floor_price)} <span class="${changeClass(it.downside_risk)}">${dwn}</span></td>
          <td>${rule40}</td>
          <td>${fmt(it.target_per)}</td>
          <td class="stage-cell">${it.position_stage || "N/A"}</td>
          <td><span class="tag ${tagClass(it.signal)}">${it.signal || "⚪ 區間觀望"}</span></td>
          <td>${fmt(it.price)}</td>
          <td class="${chgCls}">${fmtPct(it.change_pct)}</td>
        </tr>`;
      }).join("");
      document.getElementById("masterTable").innerHTML =
        `<h2>🏆 雙引擎評分總表 · 五師評分 × Excel 估值 × 森口亮五維度</h2>
        <table>
          <thead><tr>
            <th>排名</th><th>標的</th>
            <th class="sortable" data-key="master_score">五師評分 ${arrow("master_score")}</th>
            <th class="sortable" data-key="five_dim">五維度評分 ${arrow("five_dim")}</th>
            <th class="sortable" data-key="upside_2">目標價② / 上漲率② ${arrow("upside_2")}</th>
            <th>預測低點 / 下檔風險</th>
            <th class="sortable" data-key="rule_of_40">40%法則 ${arrow("rule_of_40")}</th>
            <th>複利目標 PER</th>
            <th>1:2:6 倉位指引</th><th>訊號</th><th>價格</th><th>漲跌</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
      document.querySelectorAll("#masterTable th.sortable").forEach(th => {
        th.onclick = () => renderMasterTable(data, th.dataset.key, th.dataset.key === masterSort.key ? !masterSort.asc : false);
      });
    }

    function renderMacro(macro) {
      const el = document.getElementById("macro");
      const grid = document.getElementById("macroGrid");
      if (!macro) {
        el.style.display = "none";
        return;
      }
      el.style.display = "block";
      const num = (v, suffix = "") =>
        (v === null || v === undefined) ? "N/A" : Number(v).toFixed(2) + suffix;
      const fng = macro.crypto_fear_greed;
      const fngValue = (fng === null || fng === undefined)
        ? "N/A"
        : Number(fng).toFixed(0) + (macro.crypto_fear_greed_classification ? "（" + macro.crypto_fear_greed_classification + "）" : "");
      const items = [
        { label: "🇺🇸 10年期美債殖利率", value: num(macro.us10y_yield, "%") },
        { label: "💵 美元指數 DXY", value: num(macro.dxy) },
        { label: "😨 VIX 恐慌指數", value: num(macro.vix) + (macro.vix_zone ? "（" + macro.vix_zone + "）" : "") },
        { label: "🪙 幣圈恐慌貪婪", value: fngValue },
      ];
      grid.innerHTML = items.map(it =>
        `<div class="macro-item"><div class="macro-label">${it.label}</div><div class="macro-value">${it.value}</div></div>`
      ).join("");
    }

    function render(data) {
      document.getElementById("subtitle").textContent =
        "產生時間：" + (data.generated_at || "N/A");

      const summary = document.getElementById("summary");
      const sc = data.summary?.signal_counts || {};
      let chips = `<div class="chip">總標的：${data.summary?.total_assets ?? 0} 檔</div>`;
      for (const [sig, cnt] of Object.entries(sc)) {
        chips += `<div class="chip">${sig} × ${cnt}</div>`;
      }
      summary.innerHTML = chips;

      renderMacro(data.macro_overview);
      renderMasterTable(data);

      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      for (const cat of CATEGORY_ORDER) {
        const items = data.assets?.[cat] || [];
        const card = document.createElement("section");
        card.className = "card";
        let html = `<h2>${CATEGORY_ICON[cat] || ""} ${cat}</h2>`;
        for (const it of items) {
          const cls = tagClass(it.signal);
          const chgCls = changeClass(it.change_pct);
          const bt = it.backtest_strategy_1y || {};
          html += `
            <div class="asset">
              <div class="row1">
                <span class="name">${it.name}<span class="sym">${it.symbol}</span></span>
                <span class="tag ${cls}">${it.signal || "⚪ 區間觀望"}</span>
              </div>
              <div class="metrics">
                <span>價格 <b>${fmt(it.price)}</b> <span class="${chgCls}">${fmtPct(it.change_pct)}</span></span>
                <span>RSI <b>${fmt(it.rsi14)}</b></span>
                <span>${maTrend(it.ma20, it.ma60)}</span>
                <span>殖利率 <b>${fmtYield(it.dividend_yield)}</b></span>
              </div>
              <div class="metrics">
                <span>週期定位 <b>${it.horizon || "N/A"}</b></span>
                <span>ATR14 <b>${fmt(it.atr14)}</b></span>
                <span>MA200 <b>${fmt(it.ma200)}</b></span>
                <span>HIGH20 <b>${fmt(it.high20)}</b></span>
              </div>
              <div class="metrics">
                <span>建議買入 <b>${fmt(it.ideal_buy_price)}</b></span>
                <span>嚴格止損 <b>${fmt(it.stop_loss_price)}</b></span>
                <span>目標停利 <b>${fmt(it.take_profit_price)}</b></span>
                <span>建議倉位 <b>${fmtWeight(it.suggested_weight_pct)}</b></span>
              </div>
              <div class="metrics">
                <span>1年回測勝率 <b>${fmtRate(bt.win_rate)}</b></span>
                <span>累積報酬 <b>${fmtRate(bt.strategy_return_1y)}</b></span>
              </div>
              <div class="metrics">
                <span>最大回撤 MDD <b>${fmtRateSigned(bt.max_drawdown_pct)}</b></span>
                <span>年化夏普 <b>${fmtRatio(bt.sharpe_ratio)}</b></span>
                <span>獲利因子 <b>${fmtRatio(bt.profit_factor)}</b></span>
                <span>近半年報酬 <b>${fmtRateSigned(bt.oos_return_6m)}</b></span>
              </div>
              <div class="metrics">
                <span>量能狀態 <b>${it.volume_status || "N/A"}</b></span>
                <span>1年交易 <b>${bt.trade_count_1y ?? "N/A"}</b> 次</span>
                <span>最近出場 <b>${bt.last_exit_reason || "N/A"}</b></span>
              </div>
              <div class="metrics">
                <span>出場法則 ${it.exit_rule_desc || "N/A"}</span>
              </div>
              <div class="valuation">
                <div class="metrics">
                  <span>🎯 目標價② <b>${fmt(it.target_price_2)}</b> <span class="${changeClass(it.upside_2)}">${fmtRateSigned(it.upside_2)}</span></span>
                  <span>🛡 預測低點 <b>${fmt(it.floor_price)}</b> <span class="${changeClass(it.downside_risk)}">${fmtRateSigned(it.downside_risk)}</span></span>
                  <span>📐 複利目標 PER <b>${fmt(it.target_per)}</b></span>
                  <span>⚖️ 40%法則 <b>${fmtRuleOf40(it.rule_of_40)}</b>${rule40Badge(it)}</span>
                </div>
                ${fiveDimHtml(it)}
              </div>
              <div class="masters">
                <div class="master-row">
                  <span class="score-badge ${scoreClass(it.master_score)}">🎯 五師評分 ${fmtInt(it.master_score)}</span>
                  <span class="stage">📦 ${it.position_stage || "N/A"}</span>
                </div>
                <div class="metrics">
                  <span>遊牧民 MA3 <b>${fmt(it.ma3)}</b> ${maVsPrice(it.price, it.ma3)}</span>
                  <span>MA8 <b>${fmt(it.ma8)}</b> ${maVsPrice(it.price, it.ma8)}</span>
                  <span>MA15 <b>${fmt(it.ma15)}</b> ${maVsPrice(it.price, it.ma15)}</span>
                  <span>量能倍數 <b>${fmtVolRatio(it.vol_ratio)}</b></span>
                </div>
                <div class="metrics">
                  <span>茂爺爺一目均衡 <b>${cloudLabel(it.ichimoku_cloud)}</b></span>
                  <span>RSI <b>${fmt(it.rsi14)}</b></span>
                  <span>MACD <b>${fmt(it.macd)}</b> 柱 <b>${fmt(it.macd_hist)}</b></span>
                </div>
                <div class="metrics">
                  <span>cis / 遠藤洋移動停利 <b>${fmt(it.trailing_stop_price)}</b></span>
                  <span>${it.endoh_time_cost_filter ? "🚫 " + it.endoh_time_cost_filter : "破線即停損不攤平"}</span>
                </div>
              </div>
              <div class="reason">📝 ${it.action_reason || "N/A"}</div>
            </div>`;
        }
        card.innerHTML = html;
        grid.appendChild(card);
      }
    }

    function loadJson(url) {
      return fetch(url, { cache: "no-store" }).then(r => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      });
    }

    // 部署於 Hostinger 子網域根目錄時，優先讀取 public 內的資料，失敗則 fallback
    loadJson("./public/data/latest_signals.json")
      .catch(() => loadJson("./data/latest_signals.json"))
      .then(render)
      .catch(err => {
        document.getElementById("subtitle").textContent =
          "⚠️ 無法載入資料：" + err.message;
        document.getElementById("summary").innerHTML =
          '<div class="chip">請先執行 python quant_engine.py 產生資料，並以 HTTP 伺服器開啟本頁（例如在 public 目錄執行 python -m http.server）。</div>';
      });
  </script>
</body>
</html>
