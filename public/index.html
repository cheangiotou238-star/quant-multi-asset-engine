<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>量化四大正統策略工作台</title>
<style>
  :root{
    --bg:#FBF9F4;--card:#FFFFFF;--ink:#23252B;--muted:#6E7278;--line:#E7E2D6;
    --green:#2E7D32;--red:#B23A3A;--amber:#9A7B00;--blue:#1E5AA8;--gold:#C5A059;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:"Segoe UI","Microsoft JhengHei","PingFang TC",sans-serif;line-height:1.55;max-width:1080px;margin:0 auto;padding:22px 18px 60px;}
  header{text-align:center;margin-bottom:16px;}
  header h1{font-family:Georgia,"Times New Roman",serif;font-size:1.5rem;letter-spacing:1px;font-weight:600;}
  header .sub{color:var(--muted);font-size:.82rem;margin-top:6px;}
  .health{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px;font-size:.78rem;color:var(--muted);}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;}
  .dot.green{background:var(--green);} .dot.red{background:var(--red);} .dot.amber{background:var(--amber);}

  .capital-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:16px;}
  .capital-bar label{font-size:.8rem;color:var(--muted);}
  .capital-bar input{width:150px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;font-size:.9rem;color:var(--ink);}
  .capital-bar .val{font-size:.85rem;color:var(--muted);}

  nav.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:2px solid var(--ink);margin-bottom:18px;}
  nav.tabs button{appearance:none;background:none;border:none;padding:10px 16px;font-size:.92rem;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;}
  nav.tabs button.active{color:var(--ink);border-bottom-color:var(--ink);}

  .panel{display:none;}
  .panel.active{display:block;}

  .banner{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px;text-align:center;}
  .banner .big{font-size:1.6rem;font-weight:700;font-family:Georgia,serif;}
  .banner .lbl{color:var(--muted);font-size:.8rem;}
  .macro-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px;}
  .macro-item{flex:1 1 150px;min-width:130px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-align:center;}
  .macro-item .k{font-size:.74rem;color:var(--muted);}
  .macro-item .v{font-size:1.05rem;font-weight:600;font-family:Georgia,serif;}

  .cards{display:flex;flex-direction:column;gap:14px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .card .head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .card .head .sym{font-size:1.05rem;font-weight:700;letter-spacing:.3px;}
  .card .head .nm{color:var(--muted);font-size:.8rem;}
  .card .head .sig{margin-left:auto;font-weight:600;font-size:.85rem;padding:3px 10px;border-radius:999px;border:1px solid var(--line);}
  .sig.buy{color:var(--green);border-color:var(--green);background:#EEF6EE;}
  .sig.hold{color:var(--blue);border-color:var(--blue);background:#EEF3FA;}
  .sig.def{color:var(--amber);border-color:var(--amber);background:#FAF5E6;}
  .sig.stop{color:var(--red);border-color:var(--red);background:#FAECEC;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
  .cell{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;}
  .cell .k{font-size:.72rem;color:var(--muted);margin-bottom:3px;}
  .cell .v{font-size:.95rem;font-weight:600;word-break:break-word;}
  .v.green{color:var(--green);} .v.red{color:var(--red);} .v.amber{color:var(--amber);}

  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:.85rem;}
  th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);}
  th{background:var(--bg);font-size:.76rem;color:var(--muted);letter-spacing:.3px;}
  tr:last-child td{border-bottom:none;}
  td.num{font-variant-numeric:tabular-nums;}

  .ops{display:flex;flex-direction:column;gap:14px;}
  .ops h3{font-size:.95rem;margin-bottom:8px;font-family:Georgia,serif;}
  .code{background:var(--ink);color:#F5F2EA;border-radius:8px;padding:12px 14px;font-family:Consolas,Menlo,monospace;font-size:.78rem;overflow-x:auto;white-space:pre;}
  ul.list{list-style:none;font-size:.85rem;}
  ul.list li{padding:4px 0;border-bottom:1px dashed var(--line);}
  footer{text-align:center;color:var(--muted);font-size:.75rem;margin-top:26px;}
</style>
</head>
<body>
<header>
  <h1>量化四大正統策略工作台</h1>
  <div class="sub" id="subtitle">載入中…</div>
  <div class="health" id="health"></div>
</header>
<div class="capital-bar">
  <label for="cap">💰 實盤總本金 (USD)</label>
  <input type="number" id="cap" value="100000" min="1000" step="1000">
  <span class="val" id="capVal">$100,000</span>
</div>
<nav class="tabs" id="tabs"></nav>
<div id="content"></div>
<footer>象牙白 × 深炭灰 · 四大正統機構級策略 · 100% 純本金零槓桿 · 數據與交易分離</footer>
<script>
(function () {
  "use strict";
  var CAPITAL = 100000;
  var DATA = null;

  var TAB_DEFS = [
    { id: "stocks", label: "1. 📈 個股波段 (Stocks)" },
    { id: "crypto", label: "2. 🪙 加密 CTA (Crypto)" },
    { id: "income", label: "3. 🏢 收息與債券 (REITs & Bonds)" },
    { id: "macro", label: "4. 🌍 雙動能配置與現金池 (ETF, Gold & SGOV)" },
    { id: "ops", label: "5. 📖 實盤操作與下單指令" }
  ];

  var BUY_SIGNALS = {
    "🟢 遠藤洋趨勢買進": true,
    "🟢 CTA 順勢突破買進": true,
    "🟢 收息配置買進": true,
    "🟢 雙動能配置買進": true
  };

  var STEP = { "BTC-USD": 0.00001, "ETH-USD": 0.0001, "SOL-USD": 0.01 };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function num(v, d) {
    if (v == null || isNaN(v)) return "N/A";
    return Number(v).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function pct(v, d) {
    if (v == null || isNaN(v)) return "N/A";
    return (v >= 0 ? "+" : "") + Number(v).toFixed(d == null ? 2 : d) + "%";
  }
  function sigClass(s) {
    if (!s) return "";
    if (s.indexOf("🟢") === 0) return "buy";
    if (s.indexOf("🔵") === 0) return "hold";
    if (s.indexOf("🔴") === 0) return "stop";
    return "def";
  }
  function cell(k, v, cls) {
    return '<div class="cell"><div class="k">' + esc(k) + '</div><div class="v ' + (cls || "") + '">' + v + "</div></div>";
  }

  // IBKR 純本金整數股建議
  function ibkrShares(r) {
    if (!r || r.price == null || r.suggested_weight_pct == null || r.suggested_weight_pct <= 0) {
      return '<span class="v amber">⏸️ 不新建買單</span>';
    }
    var alloc = CAPITAL * (r.suggested_weight_pct / 100);
    if (r.symbol.indexOf(".HK") >= 0) {
      var lot = 100;
      var hk = Math.floor(alloc / r.price / lot) * lot;
      return '<span class="v green">' + num(hk, 0) + " 股（每手 100）</span>";
    }
    var shares = Math.floor(alloc / r.price);
    return '<span class="v green">' + num(shares, 0) + " 股</span>";
  }
  // Binance 純現貨買入顆數（stepSize 精度）
  function binanceQty(r) {
    if (!r || r.price == null || r.suggested_weight_pct == null || r.suggested_weight_pct <= 0) {
      return '<span class="v amber">⏸️ 不新建買單</span>';
    }
    var alloc = CAPITAL * (r.suggested_weight_pct / 100) * 0.98;
    var step = STEP[r.symbol] || 0.00001;
    var qty = Math.floor((alloc / r.price) / step) * step;
    var dec = step < 0.001 ? 5 : (step < 0.01 ? 4 : 2);
    return '<span class="v green">' + qty.toFixed(dec) + " 顆（stepSize " + step + "）</span>";
  }

  function renderTabs() {
    var nav = document.getElementById("tabs");
    nav.innerHTML = "";
    TAB_DEFS.forEach(function (t) {
      var b = document.createElement("button");
      b.textContent = t.label;
      b.dataset.id = t.id;
      b.addEventListener("click", function () { activate(t.id); });
      nav.appendChild(b);
    });
  }

  function activate(id) {
    var btns = document.querySelectorAll("#tabs button");
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle("active", btns[i].dataset.id === id);
    var content = document.getElementById("content");
    if (id === "stocks") renderStocks();
    else if (id === "crypto") renderCrypto();
    else if (id === "income") renderIncome();
    else if (id === "macro") renderMacro();
    else renderOps();
  }

  function headerInfo() {
    var d = DATA || {};
    var sub = document.getElementById("subtitle");
    var gen = d.generated_at ? ("更新於 " + String(d.generated_at).replace("T", " ").slice(0, 19)) : "尚未載入";
    sub.textContent = gen;
    var h = d.system_health || {};
    var health = document.getElementById("health");
    var parts = [];
    if (h.live_count) parts.push('<span><span class="dot green"></span>Live ' + h.live_count + "</span>");
    if (h.fallback_count) parts.push('<span><span class="dot amber"></span>快取 ' + h.fallback_count + "</span>");
    if (h.degraded) parts.push('<span><span class="dot red"></span>降級：' + h.failed_symbols.join(",") + "</span>");
    health.innerHTML = parts.join("");
  }

  function renderStocks() {
    var list = (DATA && DATA.assets && DATA.assets.Stocks) || [];
    var html = '<div class="cards">';
    list.forEach(function (r) {
      html += '<div class="card"><div class="head">'
        + '<span class="sym">' + esc(r.symbol) + '</span>'
        + '<span class="nm">' + esc(r.name) + '</span>'
        + '<span class="sig ' + sigClass(r.signal) + '">' + esc(r.signal) + "</span></div>";
      html += '<div class="grid">'
        + cell("現價", num(r.price, 2))
        + cell("遠藤洋 25MA 上升趨勢", r.endo_25ma_status || "N/A", r.endo_uptrend ? "green" : "red")
        + cell("茂爺爺日線三合一", r.fujimoto_3in1_status || "N/A", (r.fujimoto_3in1_count >= 3) ? "green" : "amber")
        + cell("森口亮 40% 法則", (r.rule_of_40 == null ? "N/A" : num(r.rule_of_40, 1) + "%" + (r.rule_of_40_pass ? " ✅" : "")), r.rule_of_40_pass ? "green" : "amber")
        + cell("森口亮 目標價②", num(r.target_price_2, 2))
        + cell("ATR 防守止損價", num(r.atr_defense_sl, 2), "red")
        + cell("IBKR 純本金整數股買入建議", ibkrShares(r))
        + "</div></div>";
    });
    html += "</div>";
    document.getElementById("content").innerHTML = html;
  }

  function renderCrypto() {
    var list = (DATA && DATA.assets && DATA.assets.Crypto) || [];
    var html = '<div class="cards">';
    list.forEach(function (r) {
      html += '<div class="card"><div class="head">'
        + '<span class="sym">' + esc(r.symbol) + '</span>'
        + '<span class="nm">' + esc(r.name) + '</span>'
        + '<span class="sig ' + sigClass(r.signal) + '">' + esc(r.signal) + "</span></div>";
      html += '<div class="grid">'
        + cell("現價", num(r.price, 2))
        + cell("日線 MA60 牛熊濾網", r.d1_ma60_filter || "N/A", (r.d1_ma60_filter || "").indexOf("🟢") === 0 ? "green" : "red")
        + cell("CTA 六策投票", r.cta_vote_score || "N/A", (r.cta_vote_long >= 4) ? "green" : "amber")
        + cell("20 日突破價", num(r.cta_breakout_price_20d, 2))
        + cell("4H+1D 共振", r.mtf_4h_1d_resonance || "N/A", (r.mtf_4h_1d_resonance || "").indexOf("✅") === 0 ? "green" : "amber")
        + cell("Taker 買盤比", (r.taker_buy_ratio_5d == null ? "N/A" : num(r.taker_buy_ratio_5d, 1) + "%"), (r.taker_buy_ratio_5d > 50) ? "green" : "amber")
        + cell("2.5x ATR 吊燈停損價", num(r.chandelier_stop, 2), "red")
        + cell("Binance 純現貨買入顆數", binanceQty(r))
        + "</div></div>";
    });
    html += "</div>";
    document.getElementById("content").innerHTML = html;
  }

  function renderIncome() {
    var list = (DATA && DATA.assets && DATA.assets.Income) || [];
    var html = '<div class="cards">';
    list.forEach(function (r) {
      var spread = (r.yield_spread == null ? "N/A" : (r.yield_spread >= 0 ? "+" : "") + num(r.yield_spread, 2) + "%");
      html += '<div class="card"><div class="head">'
        + '<span class="sym">' + esc(r.symbol) + '</span>'
        + '<span class="nm">' + esc(r.name) + '</span>'
        + '<span class="sig ' + sigClass(r.signal) + '">' + esc(r.signal) + "</span></div>";
      html += '<div class="grid">'
        + cell("現價", num(r.price, 2))
        + cell("股息殖利率", (r.dividend_yield_pct == null ? "N/A" : num(r.dividend_yield_pct, 2) + "%"))
        + cell("對比 10Y 美債利差", spread, (r.yield_spread != null && r.yield_spread > 0) ? "green" : "amber")
        + cell("MA200 年線多空", r.ma200_position || "N/A", (r.ma200_position || "").indexOf("🟢") === 0 ? "green" : "red")
        + cell("防守止損價", num(r.current_defense_sl, 2), "red")
        + cell("IBKR 純本金買入股數/手數", ibkrShares(r))
        + "</div></div>";
    });
    html += "</div>";
    document.getElementById("content").innerHTML = html;
  }

  function renderMacro() {
    var list = (DATA && DATA.assets && DATA.assets.Macro) || [];
    var m = (DATA && DATA.macro_overview) || {};
    var park = DATA ? DATA.sgov_parking_pct : null;
    var html = "";
    html += '<div class="banner">'
      + '<div class="lbl">🏦 SGOV 美元現金池當前建議停泊比例</div>'
      + '<div class="big">' + (park == null ? "N/A" : num(park, 2) + "%") + "</div>"
      + '<div class="macro-grid">'
      + '<div class="macro-item"><div class="k">10Y 美債殖利率</div><div class="v">' + (m.us10y_yield == null ? "N/A" : num(m.us10y_yield, 3) + "%") + "</div></div>"
      + '<div class="macro-item"><div class="k">美元指數 DXY</div><div class="v">' + num(m.dxy, 2) + "</div></div>"
      + '<div class="macro-item"><div class="k">VIX 恐慌指數</div><div class="v">' + num(m.vix, 2) + " (" + (m.vix_zone || "N/A") + ")</div></div>"
      + '<div class="macro-item"><div class="k">幣圈恐慌貪婪</div><div class="v">' + (m.crypto_fear_greed == null ? "N/A" : num(m.crypto_fear_greed, 0) + " (" + (m.crypto_fear_greed_classification || "N/A") + ")") + "</div></div>"
      + "</div></div>";

    html += "<table><thead><tr>"
      + "<th>標的</th><th>現價</th><th>MA200 絕對動能</th><th>6 個月相對 SGOV 超額報酬</th><th>動能排名 Rank</th><th>建議配置權重 %</th><th>IBKR 委託單試算</th>"
      + "</tr></thead><tbody>";
    list.forEach(function (r) {
      var abs = r.above_ma200 ? '<span class="v green">站上</span>' : '<span class="v red">跌破</span>';
      html += "<tr>"
        + "<td><b>" + esc(r.symbol) + "</b> " + esc(r.name) + "</td>"
        + '<td class="num">' + num(r.price, 2) + "</td>"
        + "<td>" + abs + "</td>"
        + '<td class="num">' + (r.excess_return_vs_sgov == null ? "N/A" : pct(r.excess_return_vs_sgov)) + "</td>"
        + '<td class="num">' + (r.momentum_rank == null ? "—" : r.momentum_rank) + "</td>"
        + '<td class="num">' + (r.suggested_weight_pct == null ? "0" : num(r.suggested_weight_pct, 2) + "%") + "</td>"
        + "<td>" + ibkrShares(r) + "</td>"
        + "</tr>";
    });
    html += "</tbody></table>";
    document.getElementById("content").innerHTML = html;
  }

  function renderOps() {
    var ls = (DATA && DATA.ledger_summary) || {};
    var html = '<div class="ops">';
    html += '<div class="card"><h3>💰 本金試算器用法</h3><ul class="list">'
      + "<li>於頁面頂部輸入「實盤總本金 (USD)」，四個策略分頁的「IBKR 純本金整數股買入建議」與「Binance 純現貨買入顆數」會即時重算。</li>"
      + "<li>純本金鐵律：僅用已結算現金，單一標的 ≤ 20%，手續費 + 滑點計入買入總額，零槓桿、零借貸、零放空。</li>"
      + "</ul></div>";

    html += '<div class="card"><h3>🔒 IBKR / Binance 十大純本金安全閘門狀態</h3><ul class="list">'
      + "<li>① 品種攔截：Crypto/.TW 走 Binance，槓桿反向 ETN 禁買清單攔截</li>"
      + "<li>② 訊號過濾：僅「看多」主訊號才建新買單，跌破防守只平倉不追價</li>"
      + "<li>③ 同幣種現金鎖：已結算 SettledCash 檢核，禁止跨幣種自動借貸計息</li>"
      + "<li>④ 整數股 / 港股每手對齊：美股整數股、0823.HK 每手 100 股</li>"
      + "<li>⑤ 手續費蠶食攔截：雙邊最低手續費佔比 ≤ 0.50%</li>"
      + "<li>⑥ 單一標的 20% 防跳空上限</li>"
      + "<li>⑦ 財報前夕跳空禁買窗：財報前 3 天禁止新建波段買單</li>"
      + "<li>⑧ GTC 括號單原子綁定：限價買入 + 止損 + 停利三單綁定送出</li>"
      + "<li>⑨ 單次執行最多 5 組委託單（熔斷）＋每單間隔 1.5 秒</li>"
      + "<li>⑩ 異常持倉巡檢：負持倉 / 碎股 / 負現金凍結</li>"
      + "</ul></div>";

    html += '<div class="card"><h3>📒 歷史訊號帳本摘要（signal_ledger.csv）</h3><ul class="list">'
      + "<li>累計訊號筆數：" + num(ls.total_signals, 0) + "</li>"
      + "<li>以 date + symbol 去重，每日自動追記四大策略訊號、建議倉位、40% 法則、目標價②、利差與動能排名。</li>"
      + "</ul></div>";

    html += '<div class="card"><h3>⌨️ 一行式終端機下單指令</h3>'
      + '<div class="code">python -u quant_engine.py --offline'
      + "\n"
      + "python -u ibkr_bridge.py --dry-run"
      + "\n"
      + "python -u binance_spot_bridge.py --dry-run"
      + "\n"
      + "python notifier.py</div>"
      + "<p style=\"font-size:.8rem;color:var(--muted);margin-top:8px;\">實盤連線 IB Gateway / TWS 後，將 --dry-run 改為 --execute（ibkr_bridge.py）即送出 GTC 括號單。</p>"
      + "</div>";

    html += "</div>";
    document.getElementById("content").innerHTML = html;
  }

  // 多重路徑 JSON 載入器：依序探測 public/data/ 與 data/（相對 + 絕對），
  // 每次 fetch 先檢查 res.ok，再以 res.text() 驗證內容以「{」開頭（防 404/403 回傳 HTML），
  // 成功 JSON.parse 後即採用；任一環節失敗就換下一條路徑。
  var JSON_BASE_PATHS = ["./public/data/", "./data/", "/public/data/", "/data/"];

  function loadJsonMultiPath(basename) {
    var ts = Date.now();
    var urls = JSON_BASE_PATHS.map(function (p) { return p + basename + "?t=" + ts; });
    var idx = 0;
    function tryNext() {
      if (idx >= urls.length) {
        return Promise.reject(new Error("所有路徑皆無法載入 " + basename));
      }
      var url = urls[idx++];
      return fetch(url, { cache: "no-store" })
        .then(function (res) {
          if (!res.ok) return tryNext();
          return res.text().then(function (txt) {
            var clean = String(txt == null ? "" : txt).replace(/^\uFEFF/, "").trim();
            if (clean.charAt(0) !== "{" || clean.indexOf("<!DOCTYPE") === 0 || clean.indexOf("<html") === 0) {
              return tryNext();
            }
            try {
              return JSON.parse(clean);
            } catch (err) {
              return tryNext();
            }
          });
        })
        .catch(function () { return tryNext(); });
    }
    return tryNext();
  }

  function init() {
    renderTabs();
    var capInput = document.getElementById("cap");
    var capVal = document.getElementById("capVal");
    function refreshCap() {
      CAPITAL = parseFloat(capInput.value) || 100000;
      capVal.textContent = "$" + CAPITAL.toLocaleString("en-US");
      var act = document.querySelector("#tabs button.active");
      activate(act ? act.dataset.id : "stocks");
    }
    capInput.addEventListener("input", refreshCap);

    loadJsonMultiPath("latest_signals.json")
      .then(function (d) {
        DATA = d;
        headerInfo();
        activate("stocks");
        // 對 ibkr_order_plan.json 與 binance_spot_plan.json 亦套用相同雙路徑讀取邏輯
        loadJsonMultiPath("ibkr_order_plan.json").then(function (p) {
          DATA.ibkr_order_plan = p;
        }).catch(function () {});
        loadJsonMultiPath("binance_spot_plan.json").then(function (p) {
          DATA.binance_spot_plan = p;
        }).catch(function () {});
      })
      .catch(function (e) {
        document.getElementById("subtitle").textContent = "載入資料失敗：" + e;
        document.getElementById("content").innerHTML = '<div class="banner"><div class="lbl">無法載入 latest_signals.json（已依序嘗試 ./public/data/、./data/、/public/data/、/data/ 等路徑），請先執行 python -u quant_engine.py --offline</div></div>';
      });
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
</body>
</html>
